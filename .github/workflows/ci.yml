name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Network isolation for the test suite is enforced in-process (tests/helpers/no-network.ts replaces
# the global fetch with a throwing function, verified by tests/unit/no-network.test.ts). Proxy
# environment variables are not used: Node's fetch ignores them unless NODE_USE_ENV_PROXY is set,
# which only exists on Node 24+.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:check
